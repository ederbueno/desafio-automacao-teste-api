name: Testes Automatizados da API

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout do código
        uses: actions/checkout@v3

      - name: ☕ Instalar Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🛠️ Dar permissão ao Gradle Wrapper
        run: chmod +x gradlew

      - name: 🚀 Executar testes
        run: ./gradlew clean test

      - name: 📦 Gerar relatório de testes
        if: always()
        run: |
          mkdir -p build/test-report
          cp -r build/reports/tests/test build/test-report

      - name: 📤 Publicar relatório como artefato
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: relatorio-de-testes
          path: build/test-report